<style>
    @font-face {
        font-family: 'Noto Music';
        src: url('https://raw.githubusercontent.com/google/fonts/main/ofl/notomusic/NotoMusic-Regular.ttf')
            format('truetype');
    }

    .unicoda {
        --staff-size: 4.8rem;
        --slot: 0.75rem;
        --staff-step: calc(var(--staff-size) * 0.122);
        --note-size: calc(var(--staff-step) * 4);
        margin: 1.5rem 0;
        color: inherit;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 0;
        overflow-x: auto;
    }

    .unicoda > :is(figcaption, details) {
        flex: 0 0 100%;
    }

    .unicoda details {
        text-align: left;
    }

    .unicoda .measure {
        --prefix: 0.75rem;
        --width: calc(var(--prefix) + 16 * var(--slot));
        --stretch: calc(var(--width) / var(--staff-size));
        flex: 0 0 var(--width);
        padding-bottom: 0.5rem;
        position: relative;
        break-inside: avoid;
    }

    .unicoda .measure:first-of-type {
        --accidental-slot: 0.65rem;
        --meter-space: 1.05rem;
        --prefix: calc(1.8rem + (-2 - var(--column)) * var(--accidental-slot) + var(--meter-space));
    }

    .unicoda .measure > div {
        height: 8rem;
        interactivity: inert;
        user-select: none;
    }

    .unicoda .measure > p {
        height: 1.5rem;
        margin: 0;
        position: relative;
        text-align: left;
    }

    .unicoda [data-pos] {
        left: calc(var(--prefix) + (var(--column) - 1) * var(--slot));
        position: absolute;
        top: 0;
    }

    .unicoda .measure > p > span {
        white-space: pre;
    }

    .unicoda .measure::before,
    .unicoda .measure > div > [data-pos] {
        font: var(--note-size) / 1 'Noto Music';
    }

    .unicoda .measure::before {
        content: '\1d11a'; /* musical symbol five-line staff */
        font-size: var(--staff-size);
        left: calc(-0.05 * var(--staff-size) * var(--stretch));
        position: absolute;
        top: 2rem;
        transform: scaleX(var(--stretch));
        transform-origin: left top;
    }

    .unicoda .measure > div > [data-pos]:not([data-pos*='-']) {
        top: calc(
            2.036rem + var(--pitch) * var(--staff-step) - var(--note-size) * var(--head-center)
        );
        transform: scaleY(var(--stem-direction));
    }

    .unicoda .measure > div > :first-child[data-pos*='-'] {
        left: 0.1rem;
        top: calc(2.036rem + 6 * var(--staff-step) - var(--note-size) * 0.873);
    }

    .unicoda [data-pos*='-'] {
        left: calc(
            var(--prefix) - var(--meter-space) + (var(--column) + 1) * var(--accidental-slot)
        );
    }

    .unicoda .measure > div > [data-pos*='-']:not(:first-child, [data-pos$='-1']) {
        font-size: 1.5rem;
        top: calc(2.036rem + var(--pitch) * var(--staff-step) - 1.5rem * 0.8645);
    }

    .unicoda .measure > div > [data-pos$='-1'] {
        --column: -1;
        font: bold 1.7rem/1.37 serif;
        top: 2rem;
    }

    .unicoda .measure > div > [data-pos='a-1'] {
        top: calc(2rem + 1.7rem * 1.37);
    }

    .unicoda .measure:has(> div > :first-child[data-pos$='-9']),
    .unicoda [data-pos$='-9'] {
        --column: -9;
    }
    .unicoda .measure:has(> div > :first-child[data-pos$='-8']),
    .unicoda [data-pos$='-8'] {
        --column: -8;
    }
    .unicoda .measure:has(> div > :first-child[data-pos$='-7']),
    .unicoda [data-pos$='-7'] {
        --column: -7;
    }
    .unicoda .measure:has(> div > :first-child[data-pos$='-6']),
    .unicoda [data-pos$='-6'] {
        --column: -6;
    }
    .unicoda .measure:has(> div > :first-child[data-pos$='-5']),
    .unicoda [data-pos$='-5'] {
        --column: -5;
    }
    .unicoda .measure:has(> div > :first-child[data-pos$='-4']),
    .unicoda [data-pos$='-4'] {
        --column: -4;
    }
    .unicoda .measure:has(> div > :first-child[data-pos$='-3']),
    .unicoda [data-pos$='-3'] {
        --column: -3;
    }
    .unicoda .measure:has(> div > :first-child[data-pos$='-2']),
    .unicoda [data-pos$='-2'] {
        --column: -2;
    }

    .unicoda [data-pos$='01'] {
        --column: 1;
    }
    .unicoda [data-pos$='02'] {
        --column: 2;
    }
    .unicoda [data-pos$='03'] {
        --column: 3;
    }
    .unicoda [data-pos$='04'] {
        --column: 4;
    }
    .unicoda [data-pos$='05'] {
        --column: 5;
    }
    .unicoda [data-pos$='06'] {
        --column: 6;
    }
    .unicoda [data-pos$='07'] {
        --column: 7;
    }
    .unicoda [data-pos$='08'] {
        --column: 8;
    }
    .unicoda [data-pos$='09'] {
        --column: 9;
    }
    .unicoda [data-pos$='10'] {
        --column: 10;
    }
    .unicoda [data-pos$='11'] {
        --column: 11;
    }
    .unicoda [data-pos$='12'] {
        --column: 12;
    }
    .unicoda [data-pos$='13'] {
        --column: 13;
    }
    .unicoda [data-pos$='14'] {
        --column: 14;
    }
    .unicoda [data-pos$='15'] {
        --column: 15;
    }
    .unicoda [data-pos$='16'] {
        --column: 16;
    }

    .unicoda .measure > div > [data-pos^='g'] {
        --pitch: -1;
        --stem-direction: -1;
        --head-center: 0.127;
    }
    .unicoda .measure > div > [data-pos^='f'] {
        --pitch: 0;
        --stem-direction: -1;
        --head-center: 0.127;
    }
    .unicoda .measure > div > [data-pos^='e'] {
        --pitch: 1;
        --stem-direction: -1;
        --head-center: 0.127;
    }
    .unicoda .measure > div > [data-pos^='d'] {
        --pitch: 2;
        --stem-direction: -1;
        --head-center: 0.127;
    }
    .unicoda .measure > div > [data-pos^='c'] {
        --pitch: 3;
        --stem-direction: -1;
        --head-center: 0.127;
    }
    .unicoda .measure > div > [data-pos^='B'] {
        --pitch: 4;
        --stem-direction: -1;
        --head-center: 0.127;
    }
    .unicoda .measure > div > [data-pos^='A'] {
        --pitch: 5;
        --stem-direction: 1;
        --head-center: 0.873;
    }
    .unicoda .measure > div > [data-pos^='G'] {
        --pitch: 6;
        --stem-direction: 1;
        --head-center: 0.873;
    }
    .unicoda .measure > div > [data-pos^='F'] {
        --pitch: 7;
        --stem-direction: 1;
        --head-center: 0.873;
    }
    .unicoda .measure > div > [data-pos^='E'] {
        --pitch: 8;
        --stem-direction: 1;
        --head-center: 0.873;
    }
    .unicoda .measure > div > [data-pos^='D'] {
        --pitch: 9;
        --stem-direction: 1;
        --head-center: 0.873;
    }
</style>
